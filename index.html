<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>They Have a Theory — a podcast, coming soon</title>
<meta name="description" content="They Have a Theory — a new podcast where modern-day research meets good old-fashioned fun. Coming out soon.">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="They Have a Theory">
<meta property="og:description" content="A new podcast. Coming out soon.">
<meta property="og:image" content="assets/social-card.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ebc07a">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="grain" aria-hidden="true"></div>

<header class="hero" id="top">
  <div class="wrap hero__inner">

    <figure class="logo">
      <h1 class="visually-hidden">They Have a Theory</h1>
      <img class="logo__img" src="assets/logo.png" width="3000" height="3000"
           alt="They Have a Theory — two stick figures, one holding a stack of papers, the other a game controller.">
    </figure>

    <p class="status" role="status">
      <span class="status__dot" aria-hidden="true"></span>
      Coming out soon!
    </p>

    <p class="tagline">
      Where modern-day research meets good old-fashioned fun
    </p>
  </div>
</header>

<main id="main">

  <!-- ============================ LISTEN ============================ -->
  <section class="section section--alt" id="listen">
    <div class="wrap">
      <h2 class="section__title">Find Us Anywhere</h2>

      <ul class="platforms" id="platform-list">
        <!-- rendered from js/site.js -->
      </ul>
    </div>
  </section>

  <!-- ============================ EPISODES ============================ -->
  <section class="section section--light" id="episodes">
    <div class="wrap">
      <h2 class="section__title">Episodes</h2>

      <ol class="episodes" id="episode-list">
        <!-- rendered from js/site.js -->
      </ol>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <p class="footer__mark">They Have a Theory</p>
    <p class="footer__meta">&copy; <span id="year"></span></p>
  </div>
</footer>

<script src="js/site.js"></script>
</body>
</html>
